server:
  port: ${PORT:8080}

spring:
  application:
    name: nightmarket-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/nightmarket}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

nightmarket:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  seed-data-enabled: ${SEED_DATA_ENABLED:true}
